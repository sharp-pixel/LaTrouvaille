[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "secondhand-query-understanding"
version = "0.1.0"
description = "QLoRA fine-tuning and validation tools for persona-aware retail query understanding."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "Proprietary" }
authors = [{ name = "Search / Personalization Engineering" }]
dependencies = [
  "pydantic==2.13.4",
  "pyyaml==6.0.3",
  "typer==0.26.8",
]

[project.scripts]
quft = "query_understanding.cli:app"

[dependency-groups]
dev = [
  "mypy==2.2.0",
  "pytest==9.1.1",
  "pytest-cov==7.1.0",
  "ruff==0.15.21",
  "types-pyyaml==6.0.12.20260518",
]
train = [
  "accelerate==1.14.0",
  "bitsandbytes==0.49.2",
  "datasets==5.0.0",
  "mistral-common==1.11.5",
  "peft==0.19.1",
  "safetensors==0.8.0",
  "torch==2.13.0+cu132; (sys_platform == 'linux' and platform_machine == 'x86_64') or (sys_platform == 'win32' and platform_machine == 'AMD64')",
  "transformers==5.13.0",
  "trl==1.8.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv]
environments = [
  "sys_platform == 'linux' and platform_machine == 'x86_64'",
  "sys_platform == 'win32' and platform_machine == 'AMD64'",
]

[tool.uv.sources]
torch = [
  { index = "pytorch-cu132", marker = "(sys_platform == 'linux' and platform_machine == 'x86_64') or (sys_platform == 'win32' and platform_machine == 'AMD64')" },
]

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
markers = [
  "gpu: requires an NVIDIA GPU and the train dependency group",
  "integration: requires an external service such as OpenSearch",
  "model: downloads model metadata or weights",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "SIM", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["accelerate.*", "datasets.*", "peft.*", "torch.*", "transformers.*", "trl.*"]
ignore_missing_imports = true
follow_imports = "skip"
