services:
  app:
    build:
      context: .
      args:
        VITE_SEARCH_ENDPOINT: ${VITE_SEARCH_ENDPOINT:-/api}
        VITE_UBI_ENDPOINT: ${VITE_UBI_ENDPOINT:-http://127.0.0.1:8787/ubi}
    container_name: la-trouvaille-app
    ports:
      - "5173:80"
    depends_on:
      search-api:
        condition: service_healthy
    restart: unless-stopped

  search-api:
    build:
      context: .
      target: api
    container_name: la-trouvaille-search-api
    environment:
      - OPENSEARCH_URL=http://opensearch:9200
      - OPENSEARCH_AGENTIC_SEARCH_TIMEOUT_MS=5000
      - SEARCH_API_HOST=0.0.0.0
      - SEARCH_API_PORT=8790
    ports:
      - "8790:8790"
    depends_on:
      - opensearch
    restart: unless-stopped

  opensearch:
    image: opensearchproject/opensearch:3.7.0
    container_name: la-trouvaille-opensearch
    environment:
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - OPENSEARCH_JAVA_OPTS=-Xms1g -Xmx1g
      - DISABLE_SECURITY_PLUGIN=true
      - plugins.ml_commons.only_run_on_ml_node=false
      - indices.query.bool.max_clause_count=100
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    ports:
      - "9200:9200"
      - "9600:9600"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - opensearch-data:/usr/share/opensearch/data

  dashboards:
    image: opensearchproject/opensearch-dashboards:3.7.0
    container_name: la-trouvaille-opensearch-dashboards
    environment:
      - OPENSEARCH_HOSTS=["http://opensearch:9200"]
      - DISABLE_SECURITY_DASHBOARDS_PLUGIN=true
    ports:
      - "5601:5601"
    depends_on:
      - opensearch

volumes:
  opensearch-data:
